<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNTH PUBG UID Lookup API</title>
<meta name="description" content="Look up a PUBG Mobile nickname from a UID, verified through GamingServiceNP.">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#0e0e10;--line:#1f1f23;--text:#f2f2f2;--mute:#8a8a93;--red:#e5293b;--red2:#ff5262;--ok:#2fd27a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(229,41,59,.18),transparent 70%),var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
.wrap{width:100%;max-width:520px;animation:up .6s ease both}
.brand{display:flex;align-items:center;gap:10px;font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:.12em;font-size:14px;color:var(--mute);text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse 2s infinite}
h1{font-family:Rajdhani,sans-serif;font-size:clamp(34px,8vw,48px);line-height:1;margin:14px 0 8px;letter-spacing:.02em}
h1 span{color:var(--red)}
.sub{color:var(--mute);font-size:15px;margin-bottom:26px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px;letter-spacing:.04em}
input{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;color:var(--text);font:600 20px Rajdhani,sans-serif;letter-spacing:.08em;padding:14px 16px;outline:none;transition:border .2s,box-shadow .2s}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,41,59,.2)}
button.go{margin-top:14px;width:100%;border:0;border-radius:10px;padding:15px;background:linear-gradient(135deg,var(--red),#b3121f);color:#fff;font:700 17px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;transition:transform .15s,filter .2s}
button.go:hover{filter:brightness(1.12)}button.go:active{transform:scale(.98)}button.go:disabled{opacity:.6;cursor:wait}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:none}
.loading .spin{display:block}
.result{margin-top:16px;display:none;animation:up .35s ease both}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.k{color:var(--mute);font-size:13px}.v{font-weight:600;text-align:right;word-break:break-all}
.nick{font:700 22px Rajdhani,sans-serif;color:var(--text)}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600}
.badge.ok{background:rgba(47,210,122,.12);color:var(--ok)}.badge.bad{background:rgba(229,41,59,.14);color:var(--red2)}
.copy{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:500 12px "Space Grotesk";cursor:pointer;margin-left:8px}
.copy:hover{border-color:var(--red)}
.err{margin-top:16px;display:none;border:1px solid rgba(229,41,59,.4);background:rgba(229,41,59,.08);color:var(--red2);padding:14px;border-radius:10px;font-size:14px;animation:up .3s ease both}
footer{margin-top:22px;color:var(--mute);font-size:12px;text-align:center}
footer code{color:var(--text)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@media(min-width:900px){.wrap{max-width:560px;margin-top:6vh}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span class="dot"></span>HNTH · UID Lookup API</div>
  <h1>PUBG <span>UID</span> Lookup</h1>
  <p class="sub">Verified player nicknames via GamingServiceNP.</p>
  <form class="card" id="f" novalidate>
    <label for="uid">Enter PUBG Mobile UID</label>
    <input id="uid" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="15" placeholder="e.g. 51460787300">
    <button class="go" id="btn" type="submit"><span class="spin"></span><span id="bt">Get Nickname</span></button>
    <div class="err" id="err" role="alert"></div>
    <div class="result" id="res">
      <div class="row"><span class="k">PUBG UID</span><span class="v" id="rUid"></span></div>
      <div class="row"><span class="k">Nickname</span><span class="v"><span class="nick" id="rNick"></span><button type="button" class="copy" id="cp">Copy</button></span></div>
      <div class="row"><span class="k">Status</span><span class="badge ok">Verified · gamingservicenp</span></div>
    </div>
  </form>
  <footer>API: <code>POST /api/pubg/lookup</code></footer>
</main>
<script>
const $=id=>document.getElementById(id);
const msgs={invalid_uid:"Invalid UID. Enter 5–15 digits only.",not_found:"No player found for this UID.",timeout:"GamingServiceNP timed out. Try again.",unavailable:"GamingServiceNP's name checker is unavailable right now.",rate_limited:"Too many requests. Wait a minute and retry.",network:"Could not reach GamingServiceNP.",changed:"Lookup service changed and is temporarily unavailable.",malformed:"Lookup failed: unexpected response from GamingServiceNP."};
$("uid").addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,""));
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const uid=$("uid").value.trim();
  $("err").style.display=$("res").style.display="none";
  if(!/^\d{5,15}$/.test(uid)) return showErr(msgs.invalid_uid);
  const b=$("btn");b.disabled=true;b.classList.add("loading");$("bt").textContent="Looking up…";
  try{
    const r=await fetch("/api/pubg/lookup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid})});
    const d=await r.json().catch(()=>null);
    if(d&&d.success===true&&typeof d.nickname==="string"&&d.uid===uid){
      $("rUid").textContent=d.uid;$("rNick").textContent=d.nickname;$("res").style.display="block";
    } else showErr((d&&(msgs[d.code]||d.error))||"Unable to retrieve player nickname.");
  }catch{showErr("Network error. Check your connection.")}
  finally{b.disabled=false;b.classList.remove("loading");$("bt").textContent="Get Nickname"}
});
function showErr(m){$("err").textContent=m;$("err").style.display="block"}
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("rNick").textContent);$("cp").textContent="Copied";setTimeout(()=>$("cp").textContent="Copy",1500)}catch{}};
</script>
</body>
</html>
